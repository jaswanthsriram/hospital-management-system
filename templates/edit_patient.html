{% extends "base.html" %}{% block heading %}Edit patient{% endblock %}{% block content %}<div class="page-intro"><div><h2>Update patient #{{ patient.patient_id }}</h2><p>Update the patient details and save the record.</p></div><a class="text-link" href="{{ url_for('patients') }}">← Back to patients</a></div><div class="panel"><form method="post" class="form-grid"><label class="span-2">Full name *<input name="name" value="{{ patient.name }}" required></label><label>Gender<select name="gender"><option value="">Select</option>{% for g in ['Female','Male','Other'] %}<option {{ 'selected' if patient.gender == g else '' }}>{{ g }}</option>{% endfor %}</select></label><label>Date of birth<input name="dob" type="date" value="{{ patient.dob.isoformat() if patient.dob else '' }}"></label><label>Phone<input name="phone" value="{{ patient.phone or '' }}"></label><label>Blood group<select name="blood_group"><option value="">Select</option>{% for b in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}<option {{ 'selected' if patient.blood_group == b else '' }}>{{ b }}</option>{% endfor %}</select></label><label class="span-2">Address<textarea name="address" rows="2">{{ patient.address or '' }}</textarea></label><div class="span-2"><button class="btn btn-primary">Save changes</button></div></form></div>{% endblock %}
