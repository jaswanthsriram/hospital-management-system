{% extends "base.html" %}{% block heading %}Edit doctor{% endblock %}{% block content %}<div class="page-intro"><div><h2>Update doctor #{{ doctor.doctor_id }}</h2><p>Only Admin can edit or delete doctor records.</p></div><a class="text-link" href="{{ url_for('doctors') }}">← Back to doctors</a></div><div class="panel"><form method="post" class="form-grid"><label>Doctor name *<input name="name" value="{{ doctor.name }}" required></label><label>Specialization *<input name="specialization" value="{{ doctor.specialization }}" required></label><label>Phone<input name="phone" value="{{ doctor.phone or '' }}"></label><label>Email<input name="email" type="email" value="{{ doctor.email or '' }}"></label><label>Department<select name="dept_id"><option value="">Not assigned</option>{% for d in departments %}<option value="{{ d.dept_id }}" {{ 'selected' if doctor.dept_id == d.dept_id else '' }}>{{ d.dept_name }}</option>{% endfor %}</select></label><label>Consultation fee<input name="consultation_fee" type="number" min="0" step="0.01" value="{{ doctor.consultation_fee }}"></label><div class="span-2"><button class="btn btn-primary">Save changes</button></div></form></div>{% endblock %}
